  async function checkWeatherAlerts(lat, lon) {
    try {
      const res = await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`);
      if (!res.ok) throw new Error('NWS API error ' + res.status);
      const data = await res.json();
      activeAlerts = (data.features || [])
        .map(f => f.properties)
        .filter(p => p && p.severity && ['Extreme', 'Severe'].includes(p.severity))
        .map(p => ({ event: p.event, headline: p.headline, severity: p.severity }));
      alertsError = '';
    } catch (e) {
      activeAlerts = [];
      alertsError = 'Could not check weather alerts.';
    }
    alertsChecked = true;
  }

  // Ray-casting point-in-polygon. GeoJSON rings are [lon, lat] pairs.
  function pointInRing(lon, lat, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const xi = ring[i][0], yi = ring[i][1];
      const xj = ring[j][0], yj = ring[j][1];
      const intersect = ((yi > lat) !== (yj > lat)) &&
        (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function pointInGeometry(lon, lat, geometry) {
    if (!geometry) return false;
    if (geometry.type === 'Polygon') {
      if (!pointInRing(lon, lat, geometry.coordinates[0])) return false;
      // holes
      for (let h = 1; h < geometry.coordinates.length; h++) {
        if (pointInRing(lon, lat, geometry.coordinates[h])) return false;
      }
      return true;
    }
    if (geometry.type === 'MultiPolygon') {
      return geometry.coordinates.some(poly => {
        if (!pointInRing(lon, lat, poly[0])) return false;
        for (let h = 1; h < poly.length; h++) {
          if (pointInRing(lon, lat, poly[h])) return false;
        }
        return true;
      });
    }
    return false;
  }

  // Approximate flat-earth projection (fine for distances under ~100 miles) so we
  // can find how far a node sits from a warning polygon's edge, not just whether
  // it's strictly inside it.
  const MILES_PER_DEG_LAT = 69.172;
  function milesPerDegLon(lat) { return 69.172 * Math.cos(lat * Math.PI / 180); }
  function toXY(lat, lon, refLat) { return [lon * milesPerDegLon(refLat), lat * MILES_PER_DEG_LAT]; }
  function pointToSegmentMiles(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t * dx, cy = ay + t * dy;
    return Math.hypot(px - cx, py - cy);
  }
  function minDistToRingMiles(lat, lon, ring, refLat) {
    const [px, py] = toXY(lat, lon, refLat);
    let min = Infinity;
    for (let i = 0; i < ring.length - 1; i++) {
      const [ax, ay] = toXY(ring[i][1], ring[i][0], refLat);
      const [bx, by] = toXY(ring[i + 1][1], ring[i + 1][0], refLat);
      const d = pointToSegmentMiles(px, py, ax, ay, bx, by);
      if (d < min) min = d;
    }
    return min;
  }
  function minDistToGeometryMiles(lat, lon, geometry) {
    if (!geometry) return Infinity;
    let polys = [];
    if (geometry.type === 'Polygon') polys = [geometry.coordinates];
    else if (geometry.type === 'MultiPolygon') polys = geometry.coordinates;
    let min = Infinity;
    for (const poly of polys) {
      for (const ring of poly) {
        const d = minDistToRingMiles(lat, lon, ring, lat);
        if (d < min) min = d;
      }
    }
    return min;
  }

  async function checkNationwideSevereWeather() {
    nationwideLoading = true;
    nationwideError = '';
    render();
    try {
      // Sanity-check count, independent of any filtering below — if this is 0
      // while the search results below aren't, the fetch/parse pipeline itself
      // has a real bug rather than there just being no alerts right now.
      try {
        const countRes = await fetch('https://api.weather.gov/alerts/active/count');
        if (countRes.ok) {
          const countData = await countRes.json();
          nationwideRawTotal = countData.total ?? null;
        }
      } catch (_) { nationwideRawTotal = null; }

      // No query-string filtering at all here — every param combo we've tried
      // has been rejected by the API at one point or another. Filter client-side instead.
      const res = await fetch('https://api.weather.gov/alerts/active');
      if (!res.ok) {
        let detail = '';
        try { const errBody = await res.json(); detail = errBody.detail || errBody.title || ''; } catch (_) {}
        throw new Error('NWS API error ' + res.status + (detail ? ' - ' + detail : ''));
      }
      const data = await res.json();
      const allFeatures = data.features || [];
      nationwideAlertCount = allFeatures.length;

      // Classify by the alert's event name text, not severity — NWS assigns
      // 'Severe' severity to both Severe Thunderstorm Watches AND Warnings,
      // so severity alone can't tell watch from warning.
      const warnings = allFeatures.filter(f => f.properties &&
        /warning/i.test(f.properties.event || '') &&
        ['Extreme', 'Severe'].includes(f.properties.severity));
      const watches = allFeatures.filter(f => f.properties && /watch/i.test(f.properties.event || ''));

      function matchFeatures(features) {
        const matched = [];
        const seenIdx = new Set();
        for (const feature of features) {
          if (!feature.geometry) continue;
          const props = feature.properties || {};
          for (let idx = 0; idx < FULL_DB.length; idx++) {
            if (seenIdx.has(idx)) continue;
            const n = FULL_DB[idx];
            if (pointInGeometry(n.lo, n.la, feature.geometry)) {
              matched.push({ ...n, _idx: idx, _event: props.event, _severity: props.severity });
              seenIdx.add(idx);
            }
          }
        }
        return { matched, seenIdx };
      }

      // Nodes within NEARBY_RADIUS_MILES of a warning polygon's edge, but not
      // already counted as strictly inside it.
      function matchNearby(features, excludeIdx, maxMiles) {
        const nearby = [];
        const seen = new Set();
        for (const feature of features) {
          if (!feature.geometry) continue;
          const props = feature.properties || {};
          for (let idx = 0; idx < FULL_DB.length; idx++) {
            if (excludeIdx.has(idx) || seen.has(idx)) continue;
            const n = FULL_DB[idx];
            const d = minDistToGeometryMiles(n.la, n.lo, feature.geometry);
            if (d <= maxMiles) {
              nearby.push({ ...n, _idx: idx, _event: props.event, _severity: props.severity, _dist: d });
              seen.add(idx);
            }
          }
        }
        nearby.sort((a, b) => a._dist - b._dist);
        return nearby;
      }

      const warnResult = matchFeatures(warnings);
      const watchResult = matchFeatures(watches);
      nationwideMatches = warnResult.matched;
      nationwideWatchMatches = watchResult.matched;
      nationwideNearbyMatches = matchNearby(warnings, warnResult.seenIdx, NEARBY_RADIUS_MILES);
      nationwideNearbyWatchMatches = matchNearby(watches, watchResult.seenIdx, NEARBY_RADIUS_MILES);
      nationwideRawAlerts = allFeatures
        .filter(f => f.geometry && f.properties)
        .map(f => ({ event: f.properties.event, area: f.properties.areaDesc, severity: f.properties.severity }));

      const withGeom = allFeatures.filter(f => f.geometry).length;
      nationwideError = withGeom < allFeatures.length
        ? `Note: ${allFeatures.length - withGeom} active alert(s) have no published boundary and couldn't be matched to nodes.`
        : '';
    } catch (e) {
      nationwideMatches = [];
      nationwideWatchMatches = [];
      nationwideNearbyMatches = [];
      nationwideNearbyWatchMatches = [];
      nationwideError = 'Could not check nationwide alerts: ' + (e.message || 'unknown error');
    }
    nationwideLoading = false;
    nationwideChecked = true;
    render();
  }

  function haversineMiles(lat1, lon1, lat2, lon2) {
    const R = 3958.8;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  const colorCache = {};
  function colorFor(callsign) {
    if (colorCache[callsign]) return colorCache[callsign];
    let hash = 0;
    for (let i = 0; i < callsign.length; i++) hash = (hash * 31 + callsign.charCodeAt(i)) >>> 0;
    const hue = hash % 360;
    const color = `hsl(${hue}, 65%, 45%)`;
    colorCache[callsign] = color;
    return color;
  }

  function loadPinned() {
    try {
      const raw = localStorage.getItem(PINNED_KEY);
      pinned = raw ? JSON.parse(raw) : [];
    } catch (e) { pinned = []; }
    render();
  }

  function savePinned() {
    try { localStorage.setItem(PINNED_KEY, JSON.stringify(pinned)); } catch (e) {}
  }

  function locate(statusEl) {
    if (!navigator.geolocation) {
      statusEl.textContent = 'Geolocation not available in this browser.';
      return;
    }
    statusEl.textContent = 'Getting your location…';
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        statusEl.textContent = 'Location updated. Checking weather alerts…';
        render();
        await checkWeatherAlerts(userPos.lat, userPos.lon);
        statusEl.textContent = 'Location updated.';
        render();
      },
      (err) => { statusEl.textContent = 'Could not get location: ' + err.message; },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function copyNode(nodeNum, btn) {
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy #'; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(nodeNum).then(done).catch(done);
    } else { done(); }
  }

  function pinFromDb(idx) {
    const entry = FULL_DB[idx];
    const id = 'p' + entry.c + entry.t + entry.n + entry.e + Date.now();
    pinned.push({ id, name: entry.c + ' - ' + entry.t, node: entry.n, el: entry.e, city: entry.t, call: entry.c, lat: entry.la, lon: entry.lo });
    savePinned();
    render();
  }

  function addManual(name, node, city, lat, lon) {
    pinned.push({ id: 'm' + Date.now(), name, node, el: '', city, call: name.split(' ')[0] || name, lat: parseFloat(lat), lon: parseFloat(lon) });
    savePinned();
    render();
  }

  function removePinned(id) {
    pinned = pinned.filter(n => n.id !== id);
    savePinned();
    render();
  }

  function nodeRowHtml(n, showDist) {
    const dot = `<span class="asl-dot" style="background:${colorFor(n.call || n.c)}"></span>`;
    const isSw = n.s || n.sw;
    const name = (n.name || (n.c + ' - ' + n.t)) + (isSw ? ' <span class="asl-sw-badge">⚠ SKYWARN</span>' : '');
    const node = n.node || n.n;
    const el = n.el !== undefined ? n.el : n.e;
    const city = n.city || n.t;
    const state = n.st || n.state;
    const cityLabel = state ? `${city}, ${state}` : city;
    // NOTE: There is no working direct-dial URL for EchoLink-only nodes.
    // RepeaterPhone's asl:// scheme is for real AllStarLink node numbers only
    // (confirmed: the '3 + padded EchoLink number' bridge trick returns
    // "nodeNotFound" in practice). EchoLink-only nodes must be looked up by
    // callsign in RepeaterPhone's own EchoLink tab instead.
    const connectBtn = node
      ? `<a class="asl-connect" href="asl://${node}">Connect</a><button class="asl-copybtn" data-copy="${node}">Copy #</button>`
      : (el
          ? `<button class="asl-connect el" disabled title="No direct dial link - search this callsign in RepeaterPhone's EchoLink tab">EL only</button><button class="asl-copybtn" data-copy="${n.c || ''}">Copy Callsign</button>`
          : '');
    const meta = `${node ? 'ASL ' + node : ''}${node && el ? ' · ' : ''}${el ? 'EL ' + el : ''} · ${cityLabel}` +
      (showDist && n._dist !== undefined ? ` · <span class="asl-node-dist">${n._dist.toFixed(1)} mi</span>` : '');
    return { dot, name, meta, connectBtn };
  }

  function render() {
    let nearby = [];
    const severeActive = activeAlerts.length > 0;
    if (userPos) {
      nearby = FULL_DB
        .map((e, idx) => ({ ...e, _dist: haversineMiles(userPos.lat, userPos.lon, e.la, e.lo), _idx: idx }))
        .filter(e => e._dist <= 75)
        .sort((a, b) => {
          if (severeActive && (a.s || 0) !== (b.s || 0)) return (b.s || 0) - (a.s || 0);
          return a._dist - b._dist;
        });
    }

    const pinnedIds = new Set(pinned.map(p => p.node + '|' + p.el + '|' + p.city));

    let searchResults = [];
    if (showSearch && searchQuery.trim().length >= 2) {
      const q = searchQuery.trim().toLowerCase();
      searchResults = FULL_DB
        .map((e, idx) => ({ ...e, _idx: idx }))
        .filter(e => e.c.toLowerCase().includes(q) || e.t.toLowerCase().includes(q))
        .slice(0, 30);
    }

    root.innerHTML = `
      <div class="asl-card asl-header">
        <h1>Nearest AllStar Node</h1>
        <div class="asl-sub">${FULL_DB.length} nodes stored on this device</div>
        <button class="asl-btn" id="locateBtn">📍 Find nearest to me (75 mi)</button>
        <div class="asl-status" id="statusEl"></div>
        ${alertsChecked && severeActive ? `
          <div class="asl-alert-banner">
            ⚠️ ${activeAlerts.length} active severe alert${activeAlerts.length > 1 ? 's' : ''} near you:
            ${activeAlerts.map(a => a.event).join(', ')}.
            SKYWARN nodes are bumped to the top of the list below.
          </div>` : ''}
        ${alertsChecked && !severeActive && !alertsError ? '<div class="asl-small" style="margin-top:6px;">No active severe weather alerts here right now.</div>' : ''}
        ${alertsError ? `<div class="asl-small" style="margin-top:6px;">${alertsError}</div>` : ''}
      </div>

      ${pinned.length ? `
      <div class="asl-card">
        <div class="asl-node-name" style="margin-bottom:8px;">📌 Pinned</div>
        ${pinned.map(n => {
          const { dot, name, meta, connectBtn } = nodeRowHtml(n, false);
          return `
          <div class="asl-node">
            <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta}</div></div></div>
            ${connectBtn}
            <button class="asl-del" data-pin-id="${n.id}">✕</button>
          </div>`;
        }).join('')}
      </div>` : ''}

      <div class="asl-card">
        <div class="asl-node-name" style="margin-bottom:4px;">Within 75 miles</div>
        ${!userPos ? '<div class="asl-empty">Tap "Find nearest to me" to see nodes near your current location.</div>' :
          nearby.length === 0 ? '<div class="asl-empty">No stored nodes within 75 miles of here.</div>' :
          nearby.map((n, i) => {
            const { dot, name, meta, connectBtn } = nodeRowHtml(n, true);
            const isPinned = pinnedIds.has(n.n + '|' + n.e + '|' + n.t);
            return `
            <div class="asl-node ${i === 0 ? 'nearest' : ''}">
              <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta}</div></div></div>
              ${connectBtn}
              ${!isPinned ? `<button class="asl-addbtn" data-pin-idx="${n._idx}">Pin</button>` : ''}
            </div>`;
          }).join('')
        }
      </div>

      <div class="asl-card">
        <div class="asl-node-name" style="margin-bottom:4px;">⚠️ Nodes in active severe weather (nationwide)</div>
        <button class="asl-btn secondary" id="nationwideBtn" ${nationwideLoading ? 'disabled' : ''}>
          ${nationwideLoading ? 'Checking nationwide alerts…' : (nationwideChecked ? 'Refresh' : 'Check nationwide alerts')}
        </button>
        ${nationwideChecked && !nationwideLoading ? `
          <div class="asl-sub" style="margin:8px 0 0;">
            ${nationwideAlertCount} active alert${nationwideAlertCount === 1 ? '' : 's'} nationwide right now
            ${nationwideRawTotal !== null ? `(NWS count endpoint independently reports ${nationwideRawTotal})` : ''} ·
            ${nationwideMatches.length} node${nationwideMatches.length === 1 ? '' : 's'} in a Warning ·
            ${nationwideWatchMatches.length} node${nationwideWatchMatches.length === 1 ? '' : 's'} in a Watch
          </div>
          ${nationwideError ? `<div class="asl-small" style="margin-top:4px;">${nationwideError}</div>` : ''}
          ${nationwideMatches.length ? `<div class="asl-small" style="margin-top:8px;font-weight:600;">Warnings (Severe/Extreme)</div>` : ''}
          ${nationwideMatches.map(n => {
            const { dot, name, meta, connectBtn } = nodeRowHtml(n, false);
            const isPinned = pinnedIds.has(n.n + '|' + n.e + '|' + n.t);
            return `
            <div class="asl-node">
              <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta} · ${n._event}</div></div></div>
              ${connectBtn}
              ${!isPinned ? `<button class="asl-addbtn" data-pin-idx="${n._idx}">Pin</button>` : ''}
            </div>`;
          }).join('')}
          ${nationwideNearbyMatches.length ? `<div class="asl-small" style="margin-top:8px;font-weight:600;">Within ${NEARBY_RADIUS_MILES} mi of a Warning (not inside it)</div>` : ''}
          ${nationwideNearbyMatches.map(n => {
            const { dot, name, meta, connectBtn } = nodeRowHtml(n, false);
            const isPinned = pinnedIds.has(n.n + '|' + n.e + '|' + n.t);
            return `
            <div class="asl-node">
              <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta} · ${n._event} · ${n._dist.toFixed(1)} mi away</div></div></div>
              ${connectBtn}
              ${!isPinned ? `<button class="asl-addbtn" data-pin-idx="${n._idx}">Pin</button>` : ''}
            </div>`;
          }).join('')}
          ${nationwideWatchMatches.length ? `<div class="asl-small" style="margin-top:8px;font-weight:600;">Watches</div>` : ''}
          ${nationwideWatchMatches.map(n => {
            const { dot, name, meta, connectBtn } = nodeRowHtml(n, false);
            const isPinned = pinnedIds.has(n.n + '|' + n.e + '|' + n.t);
            return `
            <div class="asl-node">
              <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta} · ${n._event}</div></div></div>
              ${connectBtn}
              ${!isPinned ? `<button class="asl-addbtn" data-pin-idx="${n._idx}">Pin</button>` : ''}
            </div>`;
          }).join('')}
          ${nationwideNearbyWatchMatches.length ? `<div class="asl-small" style="margin-top:8px;font-weight:600;">Within ${NEARBY_RADIUS_MILES} mi of a Watch (not inside it)</div>` : ''}
          ${nationwideNearbyWatchMatches.map(n => {
            const { dot, name, meta, connectBtn } = nodeRowHtml(n, false);
            const isPinned = pinnedIds.has(n.n + '|' + n.e + '|' + n.t);
            return `
            <div class="asl-node">
              <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta} · ${n._event} · ${n._dist.toFixed(1)} mi away</div></div></div>
              ${connectBtn}
              ${!isPinned ? `<button class="asl-addbtn" data-pin-idx="${n._idx}">Pin</button>` : ''}
            </div>`;
          }).join('')}
        ` : ''}
        ${nationwideChecked && !nationwideLoading && nationwideRawAlerts.length ? `
          <div class="asl-toggle" id="toggleNationwideDebug" style="margin-top:8px;">
            ${showNationwideDebug ? '– Hide' : '🔎 Show'} all ${nationwideRawAlerts.length} boundary-backed alerts (for cross-checking, regardless of match)
          </div>
          ${showNationwideDebug ? `
            <div class="asl-small" style="margin-top:4px;max-height:200px;overflow-y:auto;">
              ${nationwideRawAlerts.map(a => `${a.event} (${a.severity}) — ${a.area}`).join('<br>')}
            </div>
          ` : ''}
        ` : ''}
        <div class="asl-small" style="margin-top:8px;">
          Checks every currently active NWS alert nationwide and tests which of the
          ${FULL_DB.length} stored nodes physically sit inside a warned polygon — not just "same state,"
          split into Warnings (Severe/Extreme) and Watches. Alerts without a published boundary can't be
          matched this way and are noted above.
        </div>
      </div>

      <div class="asl-card">
        <div class="asl-toggle" id="toggleSearch">${showSearch ? '– Hide search' : '🔍 Search full database'}</div>
        ${showSearch ? `
          <div style="margin-top:10px;">
            <input id="searchInput" class="asl-search-input" placeholder="Callsign or city…" value="${searchQuery}" />
            <div class="asl-search-results">
              ${searchQuery.trim().length < 2 ? '<div class="asl-empty">Type at least 2 characters.</div>' :
                searchResults.length === 0 ? '<div class="asl-empty">No matches.</div>' :
                searchResults.map(n => {
                  const { dot, name, meta, connectBtn } = nodeRowHtml(n, false);
                  const isPinned = pinnedIds.has(n.n + '|' + n.e + '|' + n.t);
                  return `
                  <div class="asl-node">
                    <div class="asl-node-info">${dot}<div class="asl-node-text"><div class="asl-node-name">${name}</div><div class="asl-node-meta">${meta}</div></div></div>
                    ${!isPinned ? `<button class="asl-addbtn" data-pin-idx="${n._idx}">Pin</button>` : '<span class="asl-small">Pinned</span>'}
                  </div>`;
                }).join('')
              }
            </div>
          </div>
        ` : ''}
      </div>

      <div class="asl-card">
        <div class="asl-toggle" id="toggleForm">${showForm ? '– Hide add-node form' : '+ Add a node manually'}</div>
        ${showForm ? `
          <div class="asl-form" style="margin-top:10px;">
            <input id="fName" placeholder="Name (e.g. Boerne repeater)" />
            <div class="asl-form-row">
              <input id="fNode" placeholder="Node #" />
              <input id="fCity" placeholder="City" />
            </div>
            <div class="asl-form-row">
              <input id="fLat" placeholder="Latitude" />
              <input id="fLon" placeholder="Longitude" />
            </div>
            <button class="asl-btn secondary" id="fUseLoc" style="margin-bottom:8px;">Use my current GPS position</button>
            <button class="asl-btn" id="fSave">Save node</button>
          </div>
        ` : ''}
      </div>

      <div class="asl-card asl-small">
        <b>Dot color</b> = owning callsign, grouped as a stand-in for "likely the same
        linked system" (several sites sharing one callsign often share node numbers too).
        This is <i>not</i> live link status — that's real-time server state this offline
        page can't check. Tap <b>Connect</b> to hand off to RepeaterPhone via <code>asl://</code>.
        Entries marked <b>EL only</b> have no AllStar node in this data — use <b>Copy EL#</b>
        and dial it manually in RepeaterPhone's EchoLink tab. Pinned nodes and anything you
        add manually are saved on this device only.
      </div>
    `;

    document.getElementById('locateBtn').onclick = () => locate(document.getElementById('statusEl'));
    document.getElementById('nationwideBtn').onclick = () => checkNationwideSevereWeather();
    const debugToggle = document.getElementById('toggleNationwideDebug');
    if (debugToggle) debugToggle.onclick = () => { showNationwideDebug = !showNationwideDebug; render(); };
    document.getElementById('toggleForm').onclick = () => { showForm = !showForm; render(); };
    document.getElementById('toggleSearch').onclick = () => { showSearch = !showSearch; render(); };

    root.querySelectorAll('[data-copy]').forEach(b => {
      b.onclick = () => copyNode(b.getAttribute('data-copy'), b);
    });
    root.querySelectorAll('[data-pin-id]').forEach(b => {
      b.onclick = () => removePinned(b.getAttribute('data-pin-id'));
    });
    root.querySelectorAll('[data-pin-idx]').forEach(b => {
      b.onclick = () => pinFromDb(parseInt(b.getAttribute('data-pin-idx'), 10));
    });

    if (showSearch) {
      const si = document.getElementById('searchInput');
      si.oninput = (e) => { searchQuery = e.target.value; render(); };
      si.focus();
      si.setSelectionRange(si.value.length, si.value.length);
    }

    if (showForm) {
      document.getElementById('fUseLoc').onclick = () => {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition((pos) => {
          document.getElementById('fLat').value = pos.coords.latitude.toFixed(5);
          document.getElementById('fLon').value = pos.coords.longitude.toFixed(5);
        });
      };
      document.getElementById('fSave').onclick = () => {
        const name = document.getElementById('fName').value.trim();
        const node = document.getElementById('fNode').value.trim();
        const city = document.getElementById('fCity').value.trim();
        const lat = document.getElementById('fLat').value.trim();
        const lon = document.getElementById('fLon').value.trim();
        if (!name || !node || !lat || !lon) return;
        addManual(name, node, city, lat, lon);
        showForm = false;
      };
    }
  }

  loadPinned();
})();
</script>
</body>
</html>
